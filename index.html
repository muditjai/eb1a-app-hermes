<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Find, view, and share redacted approved EB1A and O1 petitions."
    />
    <title>eb1a.fyi</title>
    <style>
      :root {
        color: #17201c;
        background: #f5f7f4;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        place-items: center;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: clamp(48px, 8vw, 88px) 20px;
        background:
          linear-gradient(120deg, rgba(247, 241, 232, 0.68), transparent 44%),
          linear-gradient(180deg, #fbfbf8 0%, #eef3f0 100%);
      }

      main {
        display: grid;
        justify-items: center;
        width: min(100%, 980px);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 16px;
        color: #19624f;
        font-size: 0.79rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        width: 100%;
        margin: 0;
        color: #111815;
        font-size: clamp(2.05rem, 4.8vw, 3.55rem);
        font-weight: 760;
        line-height: 1.02;
        letter-spacing: 0;
      }

      p {
        max-width: 900px;
        margin: 18px auto 0;
        color: #56625c;
        font-size: clamp(1rem, 2vw, 1.16rem);
        line-height: 1.6;
      }

      a {
        display: inline-grid;
        place-items: center;
        min-width: 172px;
        min-height: 54px;
        margin-top: 34px;
        padding: 0 24px;
        border-radius: 8px;
        color: #ffffff;
        background: linear-gradient(135deg, #17201c, #1b765e);
        box-shadow: 0 14px 28px rgba(27, 118, 94, 0.2);
        font-weight: 820;
        text-decoration: none;
        transition:
          transform 180ms ease,
          box-shadow 180ms ease;
      }

      a:hover {
        transform: translateY(-1px);
        box-shadow: 0 18px 34px rgba(27, 118, 94, 0.24);
      }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">eb1a.fyi</span>
      <h1>Approved EB1A/O1 petitions</h1>
      <p>
        A website to find, view, and share redacted approved petitions from
        applicants with backgrounds like yours.
      </p>
      <a href="/feedback">Give Feedback</a>
    </main>
  </body>
</html>
